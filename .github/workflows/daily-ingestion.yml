name: Daily Data Ingestion

on:
  schedule:
    # Run daily at 23:50 UTC — captures a near-complete 24h day of star activity
    # 23:50 (not 23:59) to avoid GitHub Actions scheduling drift past midnight
    - cron: '50 23 * * *'
  workflow_dispatch:  # Allow manual trigger
  push:
    branches: [main]  # Also run on pushes to main

env:
  PYTHON_VERSION: '3.11'

jobs:
  ingest-data:
    name: Ingest GitHub AI Repository Data
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data ingestion
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          python -c "
          from pipelines.github_ai_repos import run_pipeline, AI_QUERIES
          
          info = run_pipeline(
              destination='motherduck',
              queries=AI_QUERIES,
              max_repos_per_query=100,
              min_stars=10
          )
          print('Ingestion complete!')
          print(info)
          "

      - name: Run dbt transformations
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          DUCKDB_MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          cd dbt
          dbt deps
          dbt build --target prod

      - name: Trigger Streamlit Cloud redeploy
        run: |
          echo "✅ Data updated! Streamlit Cloud will auto-redeploy on next page load."
          echo "Dashboard: https://github-ai-trend-tracker.streamlit.app"

  # GitHub auto-disables scheduled workflows after 60 days without repo activity
  # (this happened on 2026-08-17). Re-enabling via the API on every run resets
  # that inactivity timer so the daily schedule keeps firing without commits.
  keepalive:
    name: Keep scheduled workflow enabled
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-enable workflow to reset inactivity timer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT \
            "repos/${{ github.repository }}/actions/workflows/daily-ingestion.yml/enable"
          echo "Keepalive OK: daily-ingestion.yml re-enabled"
